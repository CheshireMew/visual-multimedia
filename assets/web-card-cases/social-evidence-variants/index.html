<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editable media</title>
  <style>
    :root {
      --canvas-width: 1;
      --canvas-height: 1;
      --paper: #eee9df;
      --ink: #171915;
      --muted: #5f625b;
      --line: #c9c1b4;
      --accent: #b43d29;
      --evidence: #234d69;
      --font-serif: "Noto Serif SC", serif;
      --font-sans: "Noto Sans SC", sans-serif;
      --font-mono: "Cascadia Mono", Consolas, monospace;
      color: var(--ink);
      background: #22231f;
      font-family: var(--font-sans);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 10%, #4c4b43 0, transparent 32%),
        #23241f;
    }

    .app {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 16px;
      padding: 24px;
    }

    .viewport {
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: auto;
    }

    .canvas-shell {
      width: calc(var(--canvas-width) * 1px);
      height: calc(var(--canvas-height) * 1px);
      flex: 0 0 auto;
    }

    .media-canvas {
      position: relative;
      width: calc(var(--canvas-width) * 1px);
      height: calc(var(--canvas-height) * 1px);
      overflow: hidden;
      isolation: isolate;
      transform-origin: top left;
      background:
        linear-gradient(116deg, rgb(255 255 255 / 22%), transparent 34%),
        var(--paper);
      box-shadow: 0 38px 100px rgb(0 0 0 / 35%);
    }

    .media-canvas::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      opacity: .28;
      background-image:
        radial-gradient(circle at 18% 28%, rgb(23 25 21 / 14%) 0 1px, transparent 1.4px),
        radial-gradient(circle at 76% 61%, rgb(23 25 21 / 10%) 0 .8px, transparent 1.2px);
      background-size: 23px 27px, 31px 29px;
      mix-blend-mode: multiply;
    }

    .media-canvas::after {
      content: "";
      position: absolute;
      inset: 24px;
      z-index: 12;
      border: 1px solid rgb(23 25 21 / 13%);
      pointer-events: none;
    }

    .eyebrow,
    .issue,
    .title,
    .short-title,
    .deck,
    .evidence-stage,
    .takeaway,
    .creator-avatar,
    .creator-name {
      position: absolute;
      margin: 0;
    }

    .eyebrow,
    .issue {
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      line-height: 32px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 14px;
      background: var(--accent);
      transform: translateY(1px);
    }

    .issue {
      text-align: right;
      letter-spacing: .06em;
    }

    .title,
    .short-title {
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 84px;
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: -.045em;
      white-space: pre-line;
    }

    .short-title { display: none; }

    .deck {
      color: var(--muted);
      font-size: 32px;
      font-weight: 500;
      line-height: 1.5;
      letter-spacing: -.015em;
    }

    .evidence-stage {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 0;
      overflow: hidden;
      border-top: 2px solid var(--ink);
      border-bottom: 2px solid var(--ink);
    }

    .evidence-copy {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 28px;
      padding: 38px 42px 34px 0;
      border-right: 1px solid var(--line);
    }

    .evidence-label,
    .takeaway-label {
      margin: 0;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 19px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    blockquote {
      align-self: center;
      margin: 0;
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 48px;
      font-weight: 600;
      line-height: 1.34;
      letter-spacing: -.03em;
      white-space: pre-line;
    }

    .evidence-source {
      margin: 0;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 18px;
      line-height: 1.4;
      letter-spacing: .04em;
    }

    .evidence-diagram {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 26px;
      padding: 38px 0 34px 42px;
      color: #f5f1e8;
      background: var(--evidence);
    }

    .diagram-kicker {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      opacity: .74;
    }

    .steps {
      display: grid;
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 0;
    }

    .step {
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr);
      gap: 18px;
      align-items: center;
      border-top: 1px solid rgb(245 241 232 / 30%);
    }

    .step:first-child { border-top-color: rgb(245 241 232 / 74%); }

    .step-number {
      font-family: var(--font-mono);
      font-size: 21px;
      font-weight: 800;
      opacity: .66;
    }

    .step-copy {
      margin: 0;
      font-size: 27px;
      font-weight: 650;
      line-height: 1.35;
      letter-spacing: -.01em;
    }

    .takeaway {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
      gap: 34px;
      align-items: start;
      padding-top: 28px;
      border-top: 8px solid var(--accent);
    }

    .takeaway-copy {
      margin: 0;
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 34px;
      font-weight: 600;
      line-height: 1.45;
      letter-spacing: -.025em;
    }

    .creator-avatar {
      border: 2px solid #fffdf8;
      border-radius: 50%;
      object-fit: cover;
      object-position: 50% 50%;
      background: white;
      box-shadow: 0 0 0 1px rgb(23 25 21 / 18%);
    }

    .creator-name {
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 700;
      line-height: 34px;
      letter-spacing: .03em;
    }

    .preview-note {
      margin: 0;
      padding: 9px 14px;
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 999px;
      color: #d6d8d0;
      background: rgb(30 31 27 / 84%);
      font-family: var(--font-mono);
      font-size: 13px;
      backdrop-filter: blur(10px);
    }

    html[data-editable-variant="portrait-3x4"] .eyebrow { left: 64px; top: 56px; width: 700px; height: 32px; }
    html[data-editable-variant="portrait-3x4"] .issue { left: 900px; top: 54px; width: 116px; height: 64px; }
    html[data-editable-variant="portrait-3x4"] .title { left: 64px; top: 130px; width: 880px; height: 200px; }
    html[data-editable-variant="portrait-3x4"] .deck { left: 64px; top: 390px; width: 880px; height: 100px; }
    html[data-editable-variant="portrait-3x4"] .evidence-stage { left: 64px; top: 532px; width: 952px; height: 580px; }
    html[data-editable-variant="portrait-3x4"] .takeaway { left: 64px; top: 1156px; width: 952px; height: 154px; }
    html[data-editable-variant="portrait-3x4"] .creator-avatar { left: 64px; top: 1350px; width: 44px; height: 44px; }
    html[data-editable-variant="portrait-3x4"] .creator-name { left: 122px; top: 1354px; width: 360px; height: 34px; }

    html[data-editable-variant="landscape-21x9"] .eyebrow { left: 84px; top: 60px; width: 700px; height: 32px; }
    html[data-editable-variant="landscape-21x9"] .issue { left: 1880px; top: 60px; width: 140px; height: 64px; }
    html[data-editable-variant="landscape-21x9"] .title { left: 84px; top: 142px; width: 790px; height: 200px; font-size: 76px; }
    html[data-editable-variant="landscape-21x9"] .deck { left: 84px; top: 395px; width: 760px; height: 100px; font-size: 30px; }
    html[data-editable-variant="landscape-21x9"] .evidence-stage {
      left: 960px;
      top: 120px;
      width: 1056px;
      height: 580px;
      grid-template-columns: .92fr 1.08fr;
    }
    html[data-editable-variant="landscape-21x9"] .takeaway { left: 84px; top: 620px; width: 760px; height: 144px; }
    html[data-editable-variant="landscape-21x9"] .creator-avatar { left: 84px; top: 822px; width: 42px; height: 42px; }
    html[data-editable-variant="landscape-21x9"] .creator-name { left: 140px; top: 826px; width: 360px; height: 34px; }
    html[data-editable-variant="landscape-21x9"] blockquote { font-size: 46px; }
    html[data-editable-variant="landscape-21x9"] .takeaway { grid-template-columns: 150px minmax(0, 1fr); }
    html[data-editable-variant="landscape-21x9"] .takeaway-copy { font-size: 31px; }

    html[data-editable-variant="square-1x1"] .eyebrow { left: 56px; top: 50px; width: 700px; height: 32px; }
    html[data-editable-variant="square-1x1"] .issue { left: 900px; top: 50px; width: 124px; height: 64px; }
    html[data-editable-variant="square-1x1"] .title { display: none; }
    html[data-editable-variant="square-1x1"] .short-title {
      display: block;
      left: 56px;
      top: 132px;
      width: 850px;
      height: 194px;
      font-size: 86px;
      line-height: 1.02;
    }
    html[data-editable-variant="square-1x1"] .deck { left: 56px; top: 350px; width: 850px; height: 90px; font-size: 28px; }
    html[data-editable-variant="square-1x1"] .evidence-stage {
      left: 56px;
      top: 490px;
      width: 968px;
      height: 370px;
      grid-template-columns: .94fr 1.06fr;
    }
    html[data-editable-variant="square-1x1"] .evidence-copy { gap: 14px; padding: 22px 28px 20px 0; }
    html[data-editable-variant="square-1x1"] .evidence-label,
    html[data-editable-variant="square-1x1"] .takeaway-label { font-size: 16px; }
    html[data-editable-variant="square-1x1"] blockquote { font-size: 35px; line-height: 1.3; }
    html[data-editable-variant="square-1x1"] .evidence-source { font-size: 15px; }
    html[data-editable-variant="square-1x1"] .evidence-diagram { gap: 12px; padding: 22px 0 20px 28px; }
    html[data-editable-variant="square-1x1"] .diagram-kicker { font-size: 15px; }
    html[data-editable-variant="square-1x1"] .step { grid-template-columns: 46px minmax(0, 1fr); gap: 12px; }
    html[data-editable-variant="square-1x1"] .step-number { font-size: 17px; }
    html[data-editable-variant="square-1x1"] .step-copy { font-size: 21px; }
    html[data-editable-variant="square-1x1"] .takeaway {
      left: 56px;
      top: 900px;
      width: 968px;
      height: 100px;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 22px;
      padding-top: 18px;
      border-top-width: 6px;
    }
    html[data-editable-variant="square-1x1"] .takeaway-copy { font-size: 27px; line-height: 1.35; }
    html[data-editable-variant="square-1x1"] .creator-avatar { left: 56px; top: 1006px; width: 38px; height: 38px; }
    html[data-editable-variant="square-1x1"] .creator-name { left: 108px; top: 1008px; width: 320px; height: 30px; font-size: 17px; line-height: 30px; }

    body.capture {
      width: calc(var(--canvas-width) * 1px);
      height: calc(var(--canvas-height) * 1px);
      overflow: hidden;
      background: transparent;
    }
    body.capture .app {
      display: block;
      width: calc(var(--canvas-width) * 1px);
      height: calc(var(--canvas-height) * 1px);
      padding: 0;
    }
    body.capture .viewport {
      display: block;
      width: calc(var(--canvas-width) * 1px);
      height: calc(var(--canvas-height) * 1px);
      overflow: visible;
    }
    body.capture .canvas-shell {
      width: calc(var(--canvas-width) * 1px) !important;
      height: calc(var(--canvas-height) * 1px) !important;
    }
    body.capture .media-canvas { transform: none !important; }
    body.capture .preview-note { display: none; }
  </style>
</head>
<body>
  <main
    class="app"
    data-editable-media-root
    data-composition-id="editable-media"
    data-no-timeline
    data-start="0"
    data-duration="1"
    data-width="1080"
    data-height="1440"
    data-fps="1"
  >
    <div class="viewport" id="viewport">
      <div class="canvas-shell" id="canvasShell">
        <section
          class="media-canvas"
          id="mediaCanvas"
          aria-label="Editable media canvas"
        >
          <p class="eyebrow" data-editable-data="eyebrow" data-editable-id="eyebrow"></p>
          <p class="issue" data-editable-data="issue" data-editable-id="issue"></p>
          <h1 class="title" data-editable-data="title" data-editable-id="title"></h1>
          <h1 class="short-title" data-editable-data="short_title" data-editable-id="short-title"></h1>
          <p class="deck" data-editable-data="deck" data-editable-id="deck"></p>

          <section class="evidence-stage" data-editable-id="evidence-stage">
            <div class="evidence-copy">
              <p class="evidence-label" data-editable-data="evidence_label"></p>
              <blockquote data-editable-data="evidence_quote"></blockquote>
              <p class="evidence-source" data-editable-data="evidence_source"></p>
            </div>
            <div class="evidence-diagram">
              <p class="diagram-kicker" data-editable-data="diagram_kicker"></p>
              <div class="steps">
                <div class="step">
                  <span class="step-number">01</span>
                  <p class="step-copy" data-editable-data="step_1"></p>
                </div>
                <div class="step">
                  <span class="step-number">02</span>
                  <p class="step-copy" data-editable-data="step_2"></p>
                </div>
                <div class="step">
                  <span class="step-number">03</span>
                  <p class="step-copy" data-editable-data="step_3"></p>
                </div>
              </div>
            </div>
          </section>

          <section class="takeaway" data-editable-id="takeaway">
            <p class="takeaway-label" data-editable-data="takeaway_label"></p>
            <p class="takeaway-copy" data-editable-data="takeaway"></p>
          </section>

          <img
            class="creator-avatar"
            data-editable-image="creator_avatar"
            data-editable-id="creator-avatar"
            src=""
            alt="创作者头像"
            draggable="false"
          >
          <p class="creator-name" data-editable-data="creator_name" data-editable-id="creator-name"></p>
        </section>
      </div>
    </div>
    <p class="preview-note" id="previewNote"></p>
  </main>

  <script src="editable-media-runtime.js"></script>
  <script>
    const query = new URLSearchParams(location.search);
    const captureMode = query.get("capture") === "1";
    const canvasShell = document.querySelector("#canvasShell");
    const mediaCanvas = document.querySelector("#mediaCanvas");
    const viewport = document.querySelector("#viewport");
    let output = { width: 1, height: 1 };

    if (captureMode) document.body.classList.add("capture");
    function fitCanvas() {
      if (captureMode) return;
      const scale = Math.min(
        viewport.clientWidth / output.width,
        viewport.clientHeight / output.height,
        1
      );
      const fittedScale = Math.max(.1, scale);
      canvasShell.style.width = `${output.width * fittedScale}px`;
      canvasShell.style.height = `${output.height * fittedScale}px`;
      mediaCanvas.style.transform = `scale(${fittedScale})`;
    }

    editableMedia.ready.then(() => {
      const manifest = editableMedia.getManifest();
      const state = editableMedia.getState();
      const variant = manifest.variants.find((item) => item.id === state.variant.id);
      output = {
        width: Number(variant.canvas.width),
        height: Number(variant.canvas.height)
      };
      document.querySelector("#previewNote").textContent =
        `${variant.name} · ${output.width} × ${output.height} · 清单驱动的可编辑网页`;
      new ResizeObserver(fitCanvas).observe(viewport);
      window.addEventListener("resize", fitCanvas);
      fitCanvas();
    });
  </script>
</body>
</html>
